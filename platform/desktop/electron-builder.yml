appId: com.ggrobot.platform
productName: 机器人集群控制系统
electronLanguages: [zh-CN]   # 系统级 UI（对话框/菜单基线）走中文
npmRebuild: false   # ssh2 用纯 JS fallback（cpu-features 原生编译失败不阻塞）
directories:
  output: release/${version}
files:
  - out/**/*
  - "!**/*.map"
extraResources:
  # 内置 ASR 模型（paraformer-small int8，装完即用的默认转写档；两平台共用）
  - from: resources/asr
    to: asr
  # A3 一键装机资产：agent 源码 + SDK 协议件（whl/ros2_plugin_proto；A3Installer 上传用）
  - from: ../agents/a3
    to: a3-agent
    filter: ['**', '!deploy', '!tests', '!__pycache__']
  - from: ../agibot_a3_Ultra_aimdk-dev3.2/prebuilt/a3_aimdk-3.2.0-py3-none-any.whl
    to: a3-agent/a3_aimdk-3.2.0-py3-none-any.whl
  - from: ../agibot_a3_Ultra_aimdk-dev3.2/prebuilt/ros2_plugin_proto_aarch64
    to: a3-agent/ros2_plugin_proto_aarch64
asarUnpack:
  - "**/*.node"
mac:
  icon: resources/icon.png   # 1024 png，builder 自动转 icns
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  identity: null   # ad-hoc 签名（未购 Apple Developer）
  extraResources:
    # PyInstaller onedir 产物（Mac 本机 make sidecar-build 生成）
    - from: resources/sidecar
      to: sidecar
win:
  icon: resources/icon.png   # builder 自动转多尺寸 ico
  target:
    - target: nsis
      arch: [x64]
  extraResources:
    # Windows sidecar 来自 GitHub Actions artifact（make win-sidecar-fetch 拉取）
    - from: resources/sidecar-win
      to: sidecar
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
