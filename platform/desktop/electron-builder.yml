appId: com.ggrobot.platform
productName: 机器人集群控制系统
electronLanguages: [zh-CN]   # 系统级 UI（对话框/菜单基线）走中文
npmRebuild: false   # ssh2 用纯 JS fallback（cpu-features 原生编译失败不阻塞）
directories:
  output: release/${version}
files:
  - out/**/*
  - "!**/*.map"
extraResources:
  # PyInstaller onedir 产物（M5 make sidecar-build 生成）
  - from: resources/sidecar
    to: sidecar
  # 内置 ASR 模型（paraformer-small int8，装完即用的默认转写档）
  - from: resources/asr
    to: asr
asarUnpack:
  - "**/*.node"
mac:
  icon: resources/icon.png   # 1024 png，builder 自动转 icns
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  identity: null   # ad-hoc 签名（未购 Apple Developer）
