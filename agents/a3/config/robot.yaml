# A3-Ultra agent 配置（env GGROBOT_* 优先）

a3:
  hdu_host: 10.42.10.10   # agent 部署地 / TTS / 音频 / 资源
  mdu_host: 10.42.10.12   # 运控 / 动作命令 / 告警（⛔禁部署）
  adu_host: 10.42.10.11   # 地图 / 导航

velocity:
  publish_rate: 50        # Hz（官方 walk.py 同款）
  # 比例 1.0 ≈ mc 内部上限（非 1 m/s！按规格书日常上限标定；实机可标定修正：
  # POST /api/velocity?raw=1 发已知比例实测速度 → 真实max = 比例分之速度
  max_forward: 1.8        # m/s ↔ 比例 1.0（日常行走最大）
  max_lateral: 1.2
  max_angular: 2.0        # rad/s ↔ 比例 1.0

rpc:
  timeout: 3.0
  query_retries: 2        # 查询类幂等可重试
  ctrl_retries: 0         # 控制类不重试（TTS/动作盲重发=重复播放）

# 订阅开关（A3531001 二分排查；定位后恢复默认）
subs:
  arm: false
  bms: false
  emergency: false
  tts_status: false
  audio: false

camera:
  enable: false    # raw 流量大，疑似触发内部通信告警；按需开
  fps: 5                  # Image→JPEG 推流帧率（Phase C）
  jpeg_quality: 60

motions:
  cache_ttl: 300          # 资源清单缓存秒数（GetResourceList 限频友好）

server:
  port: 8300
