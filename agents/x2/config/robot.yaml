# ggRobot 参数配置

# ── 机器人连接 ──
robot:
  pc2_host: "10.0.1.41"
  pc3_host: "10.0.1.42"
  pc3_media_path: "/agibot/data/home/agi/media"

# ── 服务 ──
server:
  host: "0.0.0.0"
  port: 8000
  # 用户数据目录（任务/项目/手机按键/媒体），独立于部署目录，全量部署不清理
  data_dir: "~/ggRobot-data"

# ── 传感器 QoS ──

# ── 激光避障 ──
# ⚠️ 本段尚未接线：navigation/avoidance.py 独立运行，实际生效参数
#    硬编码在其 CFG 字典中（改这里不会生效）。
navigation:
  source_name: "x2_navigation"
  roi_x_min: 0.2
  roi_x_max: 4.0
  roi_y_min: -2.0
  roi_y_max: 2.0
  roi_z_min: 0.1
  roi_z_max: 1.8
  ground_tolerance: 0.08
  use_ransac_ground: true
  stop_distance: 0.4
  avoid_distance: 0.8
  slow_distance: 1.5
  robot_radius: 0.25
  safety_margin: 0.15
  max_forward_speed: 0.4
  slow_forward_speed: 0.15
  max_angular_speed: 0.8
  num_sectors: 9
  sector_angle: 120.0

# ── 速度控制 ──
velocity:
  source_name: "web_ui"
  publish_rate: 50  # Hz

# ── 麦克风采集 / ASR ──
# VAD 音频流由机器人侧 agent 发布（/agent/process_audio_output），
# ⚠️ VAD 需要唤醒词激活（v0.9+）：原生交互保持开启时唤醒词短时激活；
#    智元交互切 only_voice 模式后，首次唤醒词即长期激活。
mic:
  asr_provider: "none"          # none=只采集不识别；funasr=本地 FunASR(paraformer-zh)
  asr_model: "paraformer-zh"

# ── AI 任务生成（编排页"AI 生成"按钮）──
# provider: none=内置规则生成（离线可用）；openai=OpenAI 兼容 chat/completions 接口
# api_key 也可用环境变量 GGROBOT_AI_API_KEY 传入（避免明文进 yaml）
ai:
  provider: "openai"
  base_url: "https://api.deepseek.com"
  api_key: "sk-8a7d71866da8499784b26ac9fb9d00d8"
  # API 模型 ID 用小写（deepseek-v4-flash / deepseek-v4-pro）
  model: "deepseek-v4-flash"
